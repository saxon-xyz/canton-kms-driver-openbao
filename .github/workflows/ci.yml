name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # what the Splice participant image runs
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start OpenBao (dev mode) with Transit
        run: |
          docker run -d --name openbao -p 127.0.0.1:8200:8200 quay.io/openbao/openbao:2.7.2 \
            server -dev -dev-root-token-id=devroot -dev-listen-address=0.0.0.0:8200
          for i in $(seq 30); do curl -sf http://127.0.0.1:8200/v1/sys/health && break; sleep 1; done
          curl -sf -H "X-Vault-Token: devroot" -X POST http://127.0.0.1:8200/v1/sys/mounts/transit -d '{"type":"transit"}'
      - name: Test (unit + DA kms-driver-testing suite against OpenBao)
        env:
          BAO_ADDR: http://127.0.0.1:8200
          BAO_TOKEN: devroot
        run: sbt -batch test
      - name: Build the driver JAR
        run: sbt -batch assembly
