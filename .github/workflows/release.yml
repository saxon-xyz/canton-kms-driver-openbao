name: Release

# Push a tag like v0.1.0 to publish the driver JAR and its SHA-256 as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          sbt -batch assembly
          cd target/scala-2.13
          JAR="$(ls canton-kms-driver-*-"${RELEASE_VERSION}".jar)"
          sha256sum "$JAR" > "$JAR.sha256"
          echo "JAR=target/scala-2.13/$JAR" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" --title "$GITHUB_REF_NAME" --generate-notes
